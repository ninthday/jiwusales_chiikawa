<style>
:root {
  --tab-color: #dac7b7;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden; /* 防止左右滑動 */
  font-family: Arial, sans-serif;
  background-color: #f9f9f9;
  color: #333333;
  text-align: center;
}

body {
  /* 其他body特性留著 */
}

/* 控制按鈕共用樣式 */
.control-btn {
  position: fixed;
  width: 35px;
  height: 35px;
  border: none;
  border-radius: 50%;
  background-color: rgba(231, 212, 192, 0.9);
  opacity: 0.8;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  transition: opacity 0.2s, transform 0.2s;
  padding: 0;
}
.control-btn img,
.control-btn svg {
  width: 60%;
  height: 60%;
  pointer-events: none;
  user-select: none;
}
.control-btn svg {
  fill: #666;
}


/* 重新整理 按鈕位置 */
#refreshBtn {
  top: 70px;
  right: 10px;
}
/* 匯出備份 按鈕位置 */
#exportBtn {
  top: 115px;
  right: 10px;
}
/* 匯入備份 按鈕位置 */
#importBtn {
  top: 160px;
  right: 10px;
}


.top-bar {
  background: #dac7b7;
  color: #fff;
  padding: 10px 0;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 999;
  user-select: none;
}

.nav-bar {
  background-color: #f9f9f9;
  color: #333333;
  font-size: 11pt;
  padding: 8px 0;
  position: fixed;
  top: 40px; /* 放在 top-bar 下方 */
  width: 100%;
  z-index: 998;
  text-align: center;
  user-select: none;
  }
.nav-bar a {
  color: #333333;
  text-decoration: none;
  margin: 0 4px;
  -webkit-tap-highlight-color: transparent; /* 取消點擊時手機高亮 */
  background-color: transparent;
}

.nav-bar a:focus,
.nav-bar a:active {
  outline: none;
  background-color: transparent; /* 取消點擊時灰底 */
}
  .nav-bar a.active {
  font-weight: bold;
  color: var(--tab-color, #dac7b7);
}
 
.top-bar a {
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  font-size: 16px;
}

.logo-container {
  text-align: center;
  margin-top: 115px;
}
.logo-container img {
  width: 160px;
  height: auto;
}

h1 {
  margin-top: 0;
  margin-bottom: 5px;
  font-size: 16px;
  color: #A49393;
  user-select: none;
}

/* 分頁按鈕樣式 */
.tabs {
  width: 100%;
  max-width: 100%;
  margin: 20px auto 15px auto; /* 保持上下外距，左右置中 */
  padding: 0 2px;              /* 跟卡片容器左右內距一致 */
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  row-gap: 2px;    /* 上下排間距 */
  column-gap: 2px; /* 左右按鈕間距 */
  box-sizing: border-box;
  overflow-x: hidden;
}
@media (min-width: 768px) {
  .tabs {
    gap: 5px; /* 電腦版按鈕間距 */
    max-width: 2400px; /* 確認跟主容器一樣 */
    padding: 0 5px; /* 和主容器一樣 */
  }
}
@media (max-width: 767px) {
  .tabs {
    padding: 0 5px;
    gap: 2px;
  }
  .tab {
    flex: 0 0 60px;
    max-width: 60px;
    width: auto;  /* 取消原本的20% */
  }
  .tab-circle {
    width: 55px;
    height: 55px;
  }
  .tab-circle img {
    width: 44px;
    height: 44px;
  }
  .tab-name {
    font-size: 10px;
  }
  .tab-count {
    font-size: 8px;
  }
}
.tab {
  position: relative;
  width: 20%; /* 每排 5 個 */
  max-width: 80px; /* 電腦版不超過 80px */
  height: 110px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  transition: transform 0.3s;
}
.tab-circle {
  width: 70px;  /* 改成70x70 */
  height: 70px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto; /* 確保置中 */
}
.tab-circle img {
  width: 56px;  /* 80% 的大小 */
  height: 56px;
  object-fit: cover;
  border-radius: 50%;
  pointer-events: none;
}
.tab-circle svg {
  position: absolute;
  top: 0;
  left: 0;
  width: 70px;
  height: 70px;
  transform: rotate(-90deg);
  transform-origin: center;
  pointer-events: none;
}
.tab-name {
  font-size: 12px; /* 縮小 */
  font-weight: bold;
  color: #333333;
}

.tab-count {
  font-size: 10px; /* 縮小 */
  font-weight: normal;
  color: #666666;
}

.type-divider {
  max-width: 100%; /* 或設定與 .group-grid 同寬 */
  padding-left: 5px; /* 和 .group-grid 左右 padding 相同 */
  text-align: left;
  margin: 10px 0 5px -15px;
  font-weight: bold;
  font-size: 18px;
  color: #333333;
  user-select: none;
  white-space: nowrap;
  box-sizing: border-box;
}
.type-divider span {
  margin: 0 15px;
  font-weight: bold;
  text-align: center;
  white-space: nowrap;
}

/* 卡片區容器 */
#card-container {
  width: 100%;
  max-width: 2400px;
  margin: 0 auto;          /* 重點：置中 */
  padding: 0 15px;         /* 左右保留15px空間，避免貼邊 */
  box-sizing: border-box;
  overflow-x: hidden;
}

/* 卡片群組排版 */
.group-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
  justify-content: start;
  box-sizing: border-box;
  gap: 6px;
}
@media (max-width: 480px) {
  .group-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}
/* 卡片樣式 (手機) */
.card {
  width: 100%;            /* ✅ 改成自適應 */
  max-width: 135px;       /* ✅ 上限控制 */
  margin: 0 auto;         /* ✅ 水平置中 */
  border: 2px solid #ccc;
  border-radius: 8px;
  background-color: #ffffff !important;
  opacity: 1 !important;
  position: relative;
  cursor: pointer;
  transition: border-color 0.3s;
  text-align: center;
  user-select: none;
  color: #333333;
  box-shadow: none !important;
}
.card img {
  height: auto;
  max-height: 130px;
  width: 100%;
  margin-top: 5px;
  object-fit: contain;
  justify-content: flex-end; /* 圖片靠底 */
  align-items: center;      /* 水平置中 */
  -webkit-touch-callout: none;
}
.card .name,
.card .size {
  margin: 0px;
  font-size: 10px;
  line-height: 1.3;         /* 🚀 行距更舒服 */
  word-break: break-word;
  white-space: normal;      /* ✅ 允許多行換行 */
  overflow-wrap: break-word;/* ✅ 防止單字超出 */
  min-height: 16px;
  color: #333333 !important;
  display: block;
  width: 100%;
  box-sizing: border-box;
}
.card .name {
  font-weight: bold;
  margin-top: 2px;
  white-space: normal;       /* ✅ 正常換行 */
  word-break: normal;        /* ✅ 保留單字整體性 */
  overflow-wrap: anywhere;   /* ✅ 允許空白處換行 */
}

.card .size {
  padding-bottom: 5px;
  margin-top: -2px; /* 可選：讓尺寸稍微有一點呼吸空間 */
}
  
.card .checkmark {
  position: absolute;
  top: 3px;
  right: 3px;
  width: 16px;
  height: 16px;
  background-color: transparent;
  border-radius: 50%;
  display: none;
  align-items: center;
  justify-content: center;
}
.card.collected .checkmark {
  display: flex;
}
.checkmark svg {
  fill: white;
  width: 10px;
  height: 10px;
}

/* 底部欄 */
.bottom-bar {
  min-height: 50px;       /* 底部色塊最小高度，可依需求調整 */
  padding: 15px 0 0 0;    /* 上方內距15px，左右0，下方0 */
  line-height: normal;    /* 取消原本的 line-height 垂直置中 */
  text-align: center;
  background-color: #dac7b7;
  color: #fff;
  font-weight: bold;
  font-size: 14px;
  margin-top: 30px;
  user-select: none;
}
.bottom-bar a {
  color: #fff;
  text-decoration: none;
}

/* 電腦版卡片加寬，欄寬也固定為135px */
@media (min-width: 768px) {
  .group-grid {
    grid-template-columns: repeat(auto-fit, 135px);
  }
  .card {
    width: 135px;
  }
  .card img {
    height: 130px;
    width: auto;
    margin-top: 10px;
  }
  .card .name,
  .card .size {
    font-size: 12px;
  }
  .type-divider {
    padding-left: 5px;
  }
}

/* 強制淺色模式 */
@media (prefers-color-scheme: dark) {
  body {
    background-color: #f9f9f9;
  }
  .card {
    background-color: #ffffff !important;
    color: #333333 !important;
    border-color: #ccc !important;
    box-shadow: none !important;
    opacity: 1 !important;
  }
  .card .name,
  .card .size {
    color: #333333 !important;
  }
}
  .tab-circle svg circle:nth-child(2) {
  stroke: var(--tab-color, #999);
}

.reset-tab {
  --tab-color: #EF7C8E !important;
}

</style>
</head>
<body>

<div class="nav-bar" id="nav-bar">
  <!-- 內容由 JS 動態產生 -->
</div>
  
  <!-- LOGO -->
  <div class="logo-container">
    <img src="https://i.postimg.cc/CLBFxHs3/logo-banner.png" alt="JIWU LOGO" />

  <div class="bottom-bar">
    <a href="https://jiwusales.github.io/jiwusales_nagano" target="_blank">自嘲熊圖鑑點這邊 d(`･∀･)b</a>

  <button id="refreshBtn" class="control-btn" onclick="location.reload()" aria-label="重新整理" title="重新整理">

  <!-- 匯出與匯入按鈕 (Backup/Restore) -->
  <button id="exportBtn" class="control-btn" aria-label="匯出備份" title="匯出備份">

  <input type="file" id="importInput" style="display: none;" accept=".json" />

<script>
const SHEET_ID = "17gH9HZKvW_6fMCWYLyqnzMHj40rA7PiwWg6L0GvbFgQ";
const sheetNames = ["吉伊", "小八", "兔兔", "小桃", "師傅", "栗子", "獅薩", "古本", "其他角色"];
const colors = {
  "吉伊": "#d77485", "小八": "#6293b8", "兔兔": "#f9be3c",
  "小桃": "#838BC2", "師傅": "#CCAFA5", "栗子": "#94C973",
  "獅薩": "#FBAA60", "古本": "#eb9e97", "其他角色": "#45818e"
};
const images = {
  "吉伊": "https://i.postimg.cc/vZDs4YNZ/icon.png",
  "小八": "https://i.postimg.cc/sDTzfQKL/icon.png",
  "兔兔": "https://i.postimg.cc/xdzVPsYr/icon.png",
  "小桃": "https://i.postimg.cc/9MP36rrJ/icon.png",
  "師傅": "https://i.postimg.cc/fTq4Q4Rn/icon.png",
  "栗子": "https://i.postimg.cc/FzGMK8bS/icon.png",
  "獅薩": "https://i.postimg.cc/660Jz4sQ/icon.png",
  "古本": "https://i.postimg.cc/nh5t7yyY/icon.png",
  "其他角色": "https://i.postimg.cc/63xJbd58/icon.png"
};

const tabsContainer = document.getElementById("tabs");
const cardContainer = document.getElementById("card-container");
let collected = [];
function getCollectedKey(sheetName) {
  return `collectedDolls_${sheetName}`;
}
const tabElements = {};
let currentData = {};

function formatName(name) {
  if (!name) return "";
  const cleanName = name.trim();
  const totalLength = cleanName.length;
  if (totalLength <= 9) return cleanName;

  const maxLengthBeforeWrap = 9;
  const spaceIndex = cleanName.lastIndexOf(" ", maxLengthBeforeWrap);
  if (spaceIndex > 0) {
    return cleanName.slice(0, spaceIndex) + "<br>" + cleanName.slice(spaceIndex + 1);
  }
  return cleanName.slice(0, maxLengthBeforeWrap) + "<br>" + cleanName.slice(maxLengthBeforeWrap);
}

function createTab(sheetName) {
  const tab = document.createElement("div");
  tab.className = "tab";
  tab.style.setProperty("--tab-color", colors[sheetName] || "#999");

  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    document.documentElement.style.setProperty('--tab-color', colors[sheetName] || "#999");
    const url = new URL(window.location);
    url.searchParams.set("tab", sheetName);
    window.history.replaceState(null, "", url);
    loadSheetData(sheetName);
  });

  tabsContainer.appendChild(tab);
  tabElements[sheetName] = tab;
}

function updateTabCount(sheetName) {
  if (sheetName === "重置圖鑑") return;

  const data = currentData[sheetName] || [];
  const storedCollected = JSON.parse(localStorage.getItem(getCollectedKey(sheetName))) || [];
  const ownedCount = data.filter(item => storedCollected.includes(`${sheetName}|${item.type}|${item.name}`)).length;
  const totalCount = data.length;
  const percent = totalCount ? ownedCount / totalCount : 0;

  const radius = 28;
  const strokeWidth = 4;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference * (1 - percent);

  if (tabElements[sheetName]) {
    tabElements[sheetName].innerHTML = `
      <div class="tab-circle">
        <img src="${images[sheetName]}" alt="${sheetName}">
        <svg width="70" height="70">
          <circle cx="35" cy="35" r="${radius}" stroke="#e0e0e0" stroke-width="${strokeWidth}" fill="none"></circle>
          <circle cx="35" cy="35" r="${radius}" stroke="${colors[sheetName] || '#999'}" stroke-width="${strokeWidth}" fill="none"
            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round"></circle>
        </svg>
      </div>
      <div class="tab-label">
        <div class="tab-name">${sheetName}</div>
        <div class="tab-count">${ownedCount}/${totalCount}</div>
      </div>
    `;
  }
}
  
function renderCards(data, sheetName) {
  cardContainer.innerHTML = "";
  let grouped = {};
  data.forEach(item => {
    const type = item.type || "無類型";
    if (!grouped[type]) grouped[type] = [];
    grouped[type].push(item);
  });

  Object.keys(grouped).forEach(type => {
    // 分類標題
    const divider = document.createElement("div");
    divider.className = "type-divider";
    divider.id = type;
    divider.style.scrollMarginTop = "87px";

    const storedCollected = JSON.parse(localStorage.getItem(getCollectedKey(sheetName))) || [];
    const totalCount = grouped[type].length;
    const ownedCount = grouped[type].filter(item =>
      storedCollected.includes(`${sheetName}|${type}|${item.name}`)
    ).length;

    // 加上 data-type 屬性
    divider.innerHTML = `<span data-type="${type}">${type} (${ownedCount}/${totalCount})</span>`;
    cardContainer.appendChild(divider);

    // 卡片容器
    const groupContainer = document.createElement("div");
    groupContainer.className = "group-grid";

    grouped[type].forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.borderColor = "#ccc";

      // 給卡片加上 data-type 與 data-name
      card.setAttribute("data-type", type);
      card.setAttribute("data-name", item.name);

      const itemKey = `${sheetName}|${type}|${item.name}`;

      if (collected.includes(itemKey)) {
        card.classList.add("collected");
        card.style.borderColor = colors[sheetName] || "#ccc";
      }

      card.innerHTML = `
        <div class="checkmark" style="background-color: ${colors[sheetName] || "#ccc"}">
          <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 11.2L3.3 8.5l-1.4 1.4L6 14 14 6l-1.4-1.4z"/>
          </svg>
        </div>
        <img src="${item.imgUrl || 'https://i.postimg.cc/bv5xRs04/image.png'}" alt="${item.name}" />
        <div class="name">${formatName(item.name)}</div>
        <div class="size">${item.size}</div>
      `;

      const checkmark = card.querySelector(".checkmark");
      checkmark.style.display = collected.includes(itemKey) ? "flex" : "none";

      // 卡片點擊事件
      card.addEventListener("click", () => {
        card.classList.toggle("collected");
        const isCollected = card.classList.contains("collected");
        if (isCollected) {
          card.style.borderColor = colors[sheetName] || "#ccc";
          checkmark.style.display = "flex";
          if (!collected.includes(itemKey)) collected.push(itemKey);
        } else {
          card.style.borderColor = "#ccc";
          checkmark.style.display = "none";
          collected = collected.filter(n => n !== itemKey);
        }
        // 存 localStorage
        localStorage.setItem(getCollectedKey(sheetName), JSON.stringify(collected));

        // 更新分頁圈圈數量
        updateTabCount(sheetName);

        // 更新分類數量
        updateTypeCount(type, sheetName);
      });

      groupContainer.appendChild(card);
    });

    cardContainer.appendChild(groupContainer);
  });
}

// 更新分類數量
function updateTypeCount(type, sheetName) {
  const storedCollected = JSON.parse(localStorage.getItem(getCollectedKey(sheetName))) || [];
  const data = currentData[sheetName].filter(item => (item.type || "無類型") === type);
  const ownedCount = data.filter(item => storedCollected.includes(`${sheetName}|${type}|${item.name}`)).length;
  const totalCount = data.length;

  const titleSpan = document.querySelector(`.type-divider span[data-type="${type}"]`);
  if (titleSpan) {
    titleSpan.textContent = `${type} (${ownedCount}/${totalCount})`;
  }
}
  
function updateNavBarWithTypes(types, sheetName) {
  const navBar = document.getElementById("nav-bar");
  if (!navBar) return;

  navBar.innerHTML = "";

  types.forEach((type, idx) => {
    const a = document.createElement("a");
    a.href = `#${type}`;
    a.textContent = type;

    a.addEventListener("click", e => {
      e.preventDefault();
      navBar.querySelectorAll("a").forEach(link => link.classList.remove("active"));
      a.classList.add("active");
      window.location.hash = a.getAttribute("href");

      // 滾動到對應區塊（可保留或刪除）
      const targetId = a.getAttribute("href").substring(1);
      const targetElem = document.getElementById(targetId);
      if (targetElem) {
        targetElem.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });

    navBar.appendChild(a);
    if (idx !== types.length - 1) {
      navBar.appendChild(document.createTextNode("｜"));
    }
  });

  const areaNav = document.getElementById("area-nav");
  if (areaNav) {
    if (sheetName === "吉伊" || sheetName === "小八" || sheetName === "兔兔") {
      areaNav.style.display = "inline";
    } else {
      areaNav.style.display = "none";
    }
  }
}

function updateNavBarForSheet(sheetName) {
  const parsed = currentData[sheetName] || [];
  const uniqueTypes = [...new Set(parsed.map(item => item.type || "無類型"))];
  updateNavBarWithTypes(uniqueTypes, sheetName);
}

function loadSheetData(sheetName) {
  collected = JSON.parse(localStorage.getItem(getCollectedKey(sheetName))) || [];
  cardContainer.innerHTML = "載入中...";
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  fetch(url)
    .then(res => res.text())
    .then(t => {
      const jsonStr = t.match(/\{.*\}/s)[0];
      return JSON.parse(jsonStr);
    })
    .then(data => {
      let rows = data.table.rows || [];
      if (rows.length > 1) rows = rows.slice(1);
      const parsed = rows.map(row => ({
        type: row.c[0]?.v || "無類型",
        name: row.c[1]?.v || "",
        imgUrl: row.c[3]?.v || "",
        size: row.c[5]?.v || ""
      }));
      currentData[sheetName] = parsed;
      renderCards(parsed, sheetName);
      updateTabCount(sheetName); // ✅ 畫面更新後也同步更新分頁數量
      updateNavBarForSheet(sheetName);
    })
    .catch(err => {
      cardContainer.innerHTML = "載入資料失敗，請稍後再試。";
      console.error(err);
    });
}

function preloadAllSheets() {
  sheetNames.forEach(sheetName => {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
    fetch(url)
      .then(res => res.text())
      .then(t => JSON.parse(t.substr(47).slice(0, -2)))
      .then(data => {
        let rows = data.table.rows || [];
        if (rows.length > 1) rows = rows.slice(1);
        const parsed = rows.map(row => ({
          type: row.c[0]?.v || "無類型",
          name: row.c[1]?.v || "",
          imgUrl: row.c[3]?.v || "",
          size: row.c[5]?.v || ""
        }));
        currentData[sheetName] = parsed;
        updateTabCount(sheetName); // ✅ 這裡每個分頁即時更新數量
      })
      .catch(err => {
        console.error(`載入 ${sheetName} 資料失敗`, err);
      });
  });
}

function getInitialSheet() {
  const urlParams = new URLSearchParams(window.location.search);
  const tab = urlParams.get("tab");
  return sheetNames.includes(tab) ? tab : sheetNames[0];
}

// 初始化
sheetNames.forEach(createTab);
preloadAllSheets();
const initialSheet = getInitialSheet();
tabElements[initialSheet].classList.add("active");
document.documentElement.style.setProperty('--tab-color', colors[initialSheet] || "#999");

loadSheetData(initialSheet);

  resetTab.style.setProperty("--tab-color", "#EF7C8E");

  resetTab.innerHTML = `

      <svg width="70" height="70">

sheetNames.forEach(name => {

});

      const activeTab = document.querySelector(".tab.active .tab-name");
      if (activeTab) {
        loadSheetData(activeTab.textContent);
      }
      alert("✨寶寶圖鑑打掃乾淨ㄌ！(˶ˆᗜˆ˵)");
    }
  });

  tabsContainer.appendChild(resetTab);
}
createResetTab();

// --- Backup & Restore Functionality ---

function exportData() {
  const exportData = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith("collectedDolls_")) {
      try {
        exportData[key] = JSON.parse(localStorage.getItem(key));
      } catch (e) {
        console.warn("Skipping invalid JSON for key:", key);
      }
    }
  }
  
  const dataStr = JSON.stringify(exportData, null, 2);
  const blob = new Blob([dataStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  
  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const filename = `jiwu_collection_backup_${yyyy}${mm}${dd}.json`;
  
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById("exportBtn").addEventListener("click", exportData);

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (typeof data !== 'object' || data === null) {
        throw new Error("格式錯誤：備份檔案必須是 JSON 物件");
      }
      
      const confirmImport = confirm("(´｡• ᵕ •｡`)♡ 確定要載入備份？目前的寶寶紀錄會被蓋掉哦！");
      if (!confirmImport) return;
      
      let importCount = 0;
      Object.keys(data).forEach(key => {
        if (key.startsWith("collectedDolls_")) {
          localStorage.setItem(key, JSON.stringify(data[key]));
          importCount++;
        }
      });
      
      if (importCount > 0) {
        alert(`✨ 成功匯入 ${importCount} 個類別的收藏進度！`);
        location.reload();
      } else {
        alert("❌ 備份檔案中沒有找到有效的收藏資料。");
      }
    } catch (err) {
      alert("❌ 匯入失敗：" + err.message);
      console.error(err);
    }
  };
  reader.readAsText(file);
  // 重置 input 以便下次選擇同一個檔案也能觸發 change
  event.target.value = '';
}

document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("importInput").click();
});

document.getElementById("importInput").addEventListener("change", importData);

</script>
